# Kibana
# ${VERSION} 占位符由面板在安装时替换
version: "3"

services:
  kibana:
    image: docker.elastic.co/kibana/kibana:${VERSION}
    container_name: kibana
    volumes:
      - ./data:/usr/share/kibana/data
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://localhost:9200
    restart: unless-stopped
