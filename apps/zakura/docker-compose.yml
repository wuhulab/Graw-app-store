# Zakura
# ${VERSION} 占位符由面板在安装时替换
version: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - ./redisdata:/data
    restart: unless-stopped
  zakura:
    image: sunwuyuan/zakura-dev:${VERSION}
    container_name: zakura
    volumes:
      - ./data:/app/data
      - ./socket:/var/run/docker.sock
    ports:
      - "8787:8787"
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
