# Consul
# ${VERSION} 占位符由面板在安装时替换
version: "3"

services:
  consul:
    image: hashicorp/consul:${VERSION}
    container_name: consul
    volumes:
      - ./data:/consul/data
    ports:
      - "8500:8500"
      - "8600:8600"
    command: agent -dev -client=0.0.0.0 -ui -bind=0.0.0.0
    restart: unless-stopped
