# Palworld Server Tool
# ${VERSION} 占位符由面板在安装时替换
version: "3"

services:
  pst-web:
    image: jokerwho/palworld-server-tool:${VERSION}
    container_name: pst-web
    volumes:
      - ./data:/app/pst.db
    ports:
      - "8080:8080"
    environment:
      - PST_AGENT_URL=http://pst-agent:8081
    depends_on:
      - pst-agent
    restart: unless-stopped
  pst-agent:
    image: jokerwho/palworld-server-tool-agent:latest
    container_name: pst-agent
    ports:
      - "8081:8081"
    restart: unless-stopped
