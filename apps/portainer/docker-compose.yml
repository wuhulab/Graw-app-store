# Portainer CE - 容器管理面板
# 注意: /var/run/docker.sock 挂载可让 Portainer 直接管理宿主机容器引擎，
#       Podman 环境下请改为 /run/podman/podman.sock
version: "3"

services:
  portainer:
    image: portainer/portainer-ce:${VERSION}
    container_name: portainer
    volumes:
      - ./portainer-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9000:9000"
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
