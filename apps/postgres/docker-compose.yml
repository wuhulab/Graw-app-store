# PostgreSQL
# ${VERSION} 占位符由面板在安装时替换
version: "3"

services:
  postgres:
    image: postgres:${VERSION}
    container_name: postgres
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=postgres
    restart: unless-stopped
