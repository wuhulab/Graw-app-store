# ============================================================
# Graw 社区应用商店 - 应用元数据 data.yml
# ============================================================

name: "PostgreSQL"
id: "postgres"

category: "数据库/存储"
description: >
  功能强大的开源关系型数据库，以其可靠性和丰富的数据类型著称，支持复杂查询、事务、扩展与全文检索。本模板使用官方 PostgreSQL 16 镜像。

homepage: "https://www.postgresql.org/"

source: "https://github.com/postgres/postgres"

arch:
  - "amd64"
  - "arm64"
versions:
  - { tag: "16", label: "16.x" }
  - { tag: "15", label: "15.x" }

ports:
  - { container: 5432, label: "PostgreSQL 服务", protocol: "tcp" }

env:
  - { name: "POSTGRES_USER", default: "postgres", desc: "超级用户" }
  - { name: "POSTGRES_PASSWORD", default: "postgres123", desc: "超级用户密码" }
  - { name: "POSTGRES_DB", default: "postgres", desc: "默认数据库" }

