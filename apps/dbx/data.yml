# ============================================================
# Graw 社区应用商店 - 应用元数据 data.yml
# ============================================================

name: "DBX"
id: "dbx"


category: "开发/DevOps"
description: >
  开源数据库工作台，支持 70+ 种数据库连接与 SQL 查询、数据浏览、Schema 对比、导入导出，内置 AI 助手与 MCP Server，可 Docker 自托管。

homepage: "https://dbxio.com/"

source: "https://github.com/t8y2/dbx"

arch:
  - "amd64"
  - "arm64"
versions:
  - { tag: "latest", label: "最新" }

ports:
  - { container: 4224, label: "Web 界面", protocol: "tcp" }

env:
  - { name: "DBX_PASSWORD", default: "", desc: "Web 登录密码（建议设置）" }

