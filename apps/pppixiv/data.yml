# ============================================================
# Graw 社区应用商店 - 应用元数据 data.yml
# ============================================================

name: "pppixiv"
id: "pppixiv"

category: "网络/工具"
description: >
  Pixiv 插画批量下载工具，自带 Web 管理界面（/dashboard），输入画师 UID 即可一键批量下载其全部插画并支持预览。需配置 Pixiv 账号密码，国内访问 Pixiv 需代理。

homepage: "https://github.com/MGMCN/pppixiv"

source: "https://github.com/MGMCN/pppixiv"

arch:
  - "amd64"
  - "arm64"
versions:
  - { tag: "latest", label: "最新" }

ports:
  - { container: 5000, label: "Web 管理界面", protocol: "tcp" }

env:
  - { name: "username", default: "", desc: "Pixiv 账号（必填）" }
  - { name: "password", default: "", desc: "Pixiv 密码（必填）" }
  - { name: "port", default: "5000", desc: "服务端口" }

