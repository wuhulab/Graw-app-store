name: "哪吒监控"
id: "nezha"


category: "监控/运维"
description: >
  自托管的一站式服务器监控与运维工具，支持多端面板、实时告警、远程命令与任务管理，帮助掌握多台服务器状态。

homepage: "https://nezha.wiki/"

source: "https://github.com/naiba/nezha"

arch:
  - "amd64"
  - "arm64"
versions:
  - { tag: "latest", label: "最新" }

ports:
  - { container: 8008, label: "面板界面", protocol: "tcp" }
  - { container: 5555, label: "Agent 通信端口", protocol: "tcp" }

env:

