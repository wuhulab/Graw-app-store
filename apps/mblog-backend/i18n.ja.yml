name: "Mblog"
description: >
  オープンソースのミニマルな友人関係 / 微博（Weibo）系システムのバックエンド。画像・テキストの投稿、フォロー、プラザ閲覧に対応し、セルフホストできます。MySQL データベースとの連携が必要です。
category: "AI/開発"
ports:
  8080: "サービスポート"
env:
  MYSQL_PASS: "データベースパスワード（必須）"
  MYSQL_URL: "データベースのアドレス:ポート"
  MYSQL_DB: "データベース名"
  MBLOG_FRONT_DOMAIN: "フロントエンドのアドレス"