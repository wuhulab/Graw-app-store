name: "frp (frps 服务端)"
id: "frp"

category: "网络/工具"
description: >
  高性能内网穿透工具的服务端，通过反向代理将内网服务安全暴露到公网，支持 TCP / UDP / HTTP / HTTPS 协议。

homepage: "https://gofrp.org/"

source: "https://github.com/fatedier/frp"

arch:
  - "amd64"
  - "arm64"
versions:
  - { tag: "latest", label: "最新" }

ports:
  - { container: 7000, label: "frps 通信端口", protocol: "tcp" }

