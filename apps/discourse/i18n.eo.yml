  PostgreSQL, Redis kaj Nginx; necesas agordi domajnon kaj SMTP-retpoŝton.
category: "Panelo/Retpaĝaro"
ports:
  80: "Reteja interfaco"
env:
  DISCOURSE_HOSTNAME: "Eja domajno (deviga)"
