  DISCOURSE_SMTP_ADDRESS: "SMTP-servilo"
  DISCOURSE_SMTP_PORT: "SMTP-haveno"
  DISCOURSE_SMTP_USER_NAME: "SMTP-uzantnomo"
  DISCOURSE_SMTP_PASSWORD: "SMTP-pasvorto"